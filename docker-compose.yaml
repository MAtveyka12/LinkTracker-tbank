version: '3.8'

services:
  scrapper:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.scrapper  
    container_name: scrapper
    environment:
      - DB_URL=postgres://${DB_USER}:${DB_PASSWORD}@postgresql:5432/track_link_tbank?sslmode=disable
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_TOPIC=link-updates
      - DATABASE_HOST=postgresql
      - DATABASE_PORT=5432
      - DATABASE_NAME=track_link_tbank
      - DATABASE_SSL=disable
    depends_on:
      postgresql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      zookeeper:
        condition: service_started
      redis:
        condition: service_started
    ports:
      - "9091:9091"
    volumes:
      - ./config/config.yaml:/app/config/config.yaml
      - ./.env:/app/.env
    networks:
      - my-network
    restart: unless-stopped

  bot:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.bot 
    container_name: bot
    environment:
      - DB_URL=postgres://${DB_USER}:${DB_PASSWORD}@postgresql:5432/track_link_tbank?sslmode=disable
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_TOPIC=link-updates
      - DATABASE_HOST=postgresql
      - DATABASE_PORT=5432
      - DATABASE_NAME=track_link_tbank
      - DATABASE_SSL=disable
    depends_on:
      postgresql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      zookeeper:
        condition: service_started
      redis:
        condition: service_started
    ports:
      - "7070:7070"
    volumes:
      - ./config/config.yaml:/app/config/config.yaml
      - ./.env:/app/.env
    networks:
      - my-network
    restart: unless-stopped

  zookeeper:
    image: wurstmeister/zookeeper:latest
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
      - ZOOKEEPER_CLIENT_PORT=2181
      - ZOOKEEPER_TICK_TIME=2000
    networks:
      - my-network
    logging:
      driver: "none"

  kafka:
    image: wurstmeister/kafka:latest
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    ports:
      - "9092:9092"
    environment:
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_BROKER_ID=1
      - KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_DEFAULT_REPLICATION_FACTOR=1
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_NUM_PARTITIONS=1
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_DELETE_TOPIC_ENABLE=true
    networks:
      - my-network

  postgresql:
    image: postgres:latest
    container_name: postgresql
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=track_link_tbank
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - my-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
  
  liquibase-migrations:
    container_name: migrations
    image: liquibase/liquibase:4.29
    depends_on:
      postgresql:
        condition: service_healthy
    command:
      - --searchPath=/changesets
      - --changelog-file=master.xml
      - --driver=org.postgresql.Driver
      - --url=jdbc:postgresql://postgresql:5432/track_link_tbank
      - --username=postgres
      - --password=postgres
      - update
    volumes:
      - ./migrations:/changesets
    networks:
      - my-network

  redis:
    image: redis:7.2
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - my-network
    restart: unless-stopped

networks:
  my-network:
    driver: bridge

volumes:
  postgres_data:
