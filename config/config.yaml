env: dev # local prod

access_type: sql #orm

message_transport: kafka # http

scrapper_server:
  host: scrapper
  port: 9091

bot_server:
  host: bot
  port: 7070

database:
  host: postgresql
  port: 5432
  name: "track_link_tbank"
  sslmode: "disable"
  max_connections: 50
  min_connections: 0
  max_lifetime: 3600
  max_idle_time: 300
  health_check_period: 30

redis:
  host: redis
  port: 6379

reliability:
  http:
    timeout: 10s
    retry:
      max_retries: 3
      backoff_duration: 1s
      retryable_codes: [408, 429, 500, 502, 503, 504]
    rate_limit:
      requests_per_second: 10
      burst: 20
    circuit_breaker:
      sliding_window_size: 1
      minimum_required_calls: 1
      failure_rate_threshold: 100
      permitted_calls_in_half_open: 1
      wait_duration_in_open_state: 1s
  middleware:
    rate_limit:
      requests_per_second: 100
      burst: 200
      ttl: 1h
      cleanup: 10m
  fallback:
    enabled: true
    primary_transport: kafka
    fallback_transport: http
    retry_attempts: 3
    retry_delay: 1s